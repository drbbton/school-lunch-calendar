name: Update lunch calendar

on:
  schedule:
    # GitHub cron runs in UTC. 11:00 UTC is 6:00 AM Central during daylight
    # saving time (CDT) and 5:00 AM Central in winter (CST).
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download currently published calendar
        # Lets the generator keep timestamps for unchanged events and refuse to
        # replace a populated feed with an empty one. Missing on first deploy.
        run: |
          url="${{ steps.pages.outputs.base_url }}/deephaven-lunch.ics"
          if curl -fsSL --retry 2 -o published.ics "$url"; then
            cp published.ics docs/deephaven-lunch.ics
            echo "Downloaded $url"
          else
            echo "No published calendar yet at $url"
          fi

      - name: Generate calendar
        run: python scripts/generate_calendar.py

      - name: Check for changes
        id: compare
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f published.ics ] \
             && cmp -s published.ics docs/deephaven-lunch.ics; then
            echo "Calendar unchanged; skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. Re-enabling the workflow through the API resets that timer
    # without committing anything.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-calendar.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
